# IB Gateway, run exactly as its maintainers (gnzsnz/ib-gateway-docker)
# intend -- we don't wrap or modify their image, just configure it via env vars.
#
# network_mode: host means the container shares the host machine's network
# stack directly: IB Gateway's API then listens on the host's own
# 127.0.0.1:4002 (paper) / 127.0.0.1:4001 (live) -- reachable only from
# processes on this same machine, never exposed to the rest of your LAN.
# This is the recommended setup: colocate this with the TradingBot add-on
# (also configured with host networking) on the same Home Assistant host.
#
# See ../../DEPLOY.md for the full setup walkthrough.
services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    network_mode: host
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: ${READ_ONLY_API:-no}
      TIME_ZONE: ${TIME_ZONE:-America/New_York}
      TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-restart}
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-}
      # Set this to enable a VNC server (useful the first few times, to watch
      # the login/2FA flow). Leave empty to disable it.
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
      # Store the Gateway's own settings (jts.ini + the Global Configuration
      # XML, which includes the API "Precautions" bypass checkboxes) in the
      # persisted volume below. Without this, every container recreation
      # wipes them back to defaults -- confirmed live: the API-precaution
      # bypasses (required for the bot's directly-routed TGATE orders, which
      # the Gateway otherwise discards with error 10311/201) reverted after
      # a `docker compose up -d`, silently re-blocking all EU stock orders.
      TWS_SETTINGS_PATH: /home/ibgateway/tws_settings
    volumes:
      - tws_settings:/home/ibgateway/tws_settings

volumes:
  # Named volume (docker-managed ownership -- avoids uid mismatches a host
  # bind mount can hit on Home Assistant OS). Survives restarts, container
  # recreations, and image updates; only `docker compose down -v` deletes it.
  tws_settings:
