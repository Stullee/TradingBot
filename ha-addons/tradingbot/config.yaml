---
name: TradingBot (IB Day Trading)
version: "0.7.13"
slug: tradingbot
description: >-
  Automated day-trading bot for Interactive Brokers across US/EU/Asia stocks
  and crypto. Pluggable strategy (VWAP mean-reversion by default, EMA/RSI
  trend momentum, or trendline breakout), ATR-based bracket orders, FX-aware
  position sizing, daily loss kill switch, per-market auto-flatten. Requires
  a separately running IB Gateway (see DOCS.md) - this add-on only contains
  the trading logic.
url: https://github.com/Stullee/TradingBot
arch:
  - amd64
init: true
startup: application
boot: manual
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-line
options:
  ib_host: "127.0.0.1"
  ib_port: 4002
  ib_client_id: 17
  ib_account_id: ""
  allow_live_trading: false
  symbols: "AAPL,MSFT,NVDA"
  markets: ""
  strategy: "vwap_mean_reversion"
  bar_size: "5 mins"
  ema_fast: 9
  ema_slow: 21
  rsi_period: 14
  rsi_long_min: 50
  rsi_long_max: 70
  rsi_short_min: 30
  rsi_short_max: 50
  rsi_oversold: 30
  rsi_overbought: 70
  vwap_dist_atr_mult: 0.5
  trend_ema_period: 50
  trend_window: 20
  min_r_squared: 0.7
  atr_period: 14
  stop_atr_mult: 1.5
  target_atr_mult: 2.5
  allow_shorting: false
  risk_per_trade_pct: 0.5
  max_daily_loss_pct: 2.0
  max_concurrent_positions: 10
  max_position_pct: 20
  no_new_entries_before_close_min: 15
  flatten_before_close_min: 5
  log_level: "info"
  enable_news_monitor: false
  finnhub_api_key: ""
  anthropic_api_key: ""
  news_model: "claude-haiku-4-5-20251001"
  news_confidence_threshold: 0.6
  news_poll_interval_sec: 300
  news_max_hold_min: 240
  enable_dashboard: true
schema:
  ib_host: str
  ib_port: port
  ib_client_id: int(1,32)
  ib_account_id: str
  allow_live_trading: bool
  symbols: str
  markets: str
  strategy: list(vwap_mean_reversion|ema_rsi_momentum|trendline_breakout)
  bar_size: str
  ema_fast: int(2,200)
  ema_slow: int(2,200)
  rsi_period: int(2,100)
  rsi_long_min: float(0,100)
  rsi_long_max: float(0,100)
  rsi_short_min: float(0,100)
  rsi_short_max: float(0,100)
  rsi_oversold: float(0,100)
  rsi_overbought: float(0,100)
  vwap_dist_atr_mult: float(0.05,10)
  trend_ema_period: int(0,500)
  trend_window: int(5,200)
  min_r_squared: float(0,1)
  atr_period: int(2,100)
  stop_atr_mult: float(0.1,20)
  target_atr_mult: float(0.1,20)
  allow_shorting: bool
  risk_per_trade_pct: float(0.01,20)
  max_daily_loss_pct: float(0.1,50)
  max_concurrent_positions: int(1,20)
  max_position_pct: float(1,100)
  no_new_entries_before_close_min: int(0,120)
  flatten_before_close_min: int(0,60)
  log_level: list(debug|info|warning|error)
  enable_news_monitor: bool
  finnhub_api_key: password
  anthropic_api_key: password
  news_model: str
  news_confidence_threshold: float(0,1)
  news_poll_interval_sec: int(60,3600)
  news_max_hold_min: int(5,1440)
  enable_dashboard: bool
