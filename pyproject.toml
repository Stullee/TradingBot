[project]
name = "tradingbot"
version = "0.1.0"
description = "Automated intraday day-trading bot for Interactive Brokers (TWS/IB Gateway)"
requires-python = ">=3.11"
dependencies = [
    "ib_async>=1.0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pytz>=2024.1",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
